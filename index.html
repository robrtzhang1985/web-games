<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>小游戏合集 · Game Center</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    background:linear-gradient(160deg,#1a0f2e 0%,#3a1c4a 45%,#5b2140 75%,#2b1633 100%);
    color:#ffe9c9;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:24px 16px;user-select:none}
  h1{font-size:clamp(26px,6vw,44px);font-weight:900;font-style:italic;letter-spacing:4px;
    background:linear-gradient(180deg,#ffe9a8,#ff9d3c);-webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 2px 0 rgba(90,20,10,.8)) drop-shadow(0 0 20px rgba(255,140,60,.3))}
  .sub{margin-top:8px;font-size:14px;color:#c9a68a;letter-spacing:2px}
  .cards{display:flex;gap:20px;margin-top:34px;flex-wrap:wrap;justify-content:center;max-width:820px}
  a.card{display:block;width:min(86vw,360px);text-decoration:none;border-radius:18px;padding:22px 20px 18px;
    background:linear-gradient(165deg,rgba(255,255,255,.09),rgba(255,255,255,.03));
    border:2px solid rgba(255,210,150,.25);transition:transform .15s,border-color .15s}
  a.card:active{transform:scale(.97)}
  a.card:hover{transform:translateY(-4px);border-color:rgba(255,210,150,.6)}
  .emoji{font-size:44px}
  .card h2{margin-top:10px;font-size:22px;font-weight:900;letter-spacing:2px}
  .card.f1 h2{color:#ff9d5a}.card.f2 h2{color:#ff7ab0}
  .card p{margin-top:8px;font-size:13px;line-height:1.8;color:#d8bfa2}
  .tag{display:inline-block;margin:4px 4px 0;padding:2px 10px;border-radius:99px;font-size:11px;font-weight:700;
    background:rgba(255,210,150,.14);color:#ffd98a}
  .go{margin-top:14px;font-weight:900;font-size:15px;letter-spacing:2px}
  .card.f1 .go{color:#ffb37a}.card.f2 .go{color:#ffa9cf}
  .foot{margin-top:36px;font-size:11px;color:#8a7263;letter-spacing:1px;text-align:center;line-height:1.8}
</style>
</head>
<body>
  <h1>小游戏合集</h1>
  <div class="sub">GAME CENTER · 微信可直接打开玩</div>
  <div class="cards">
    <a class="card f1" href="ikari-fury/">
      <div class="emoji">🥊</div>
      <h2>怒之格斗 3v3</h2>
      <p>50 人大乱斗街机格斗：怒之队 / 中国武将 / 中外美女 / 光之巨人 / 怪兽 / 精灵，3v3 车轮战、全员飞行、超必杀光线、放屁冲击！</p>
      <div><span class="tag">50 角色</span><span class="tag">3v3</span><span class="tag">双人对战</span></div>
      <div class="go">开打 ▶</div>
    </a>
    <a class="card f2" href="sweet-match/">
      <div class="emoji">💗</div>
      <h2>甜心消消乐</h2>
      <p>粉色梦幻风糖果三消：4 连条纹糖、L 型炸弹、5 连彩虹糖，连锁 combo 停不下来～</p>
      <div><span class="tag">三消</span><span class="tag">关卡制</span><span class="tag">闺蜜安利</span></div>
      <div class="go">开玩 ▶</div>
    </a>
  </div>
  <div class="foot">同人致敬粉丝作品 · 角色为 AI 生成原创立绘 · 与任何官方无关<br>手机 / 电脑浏览器均可，无需安装</div>
</body>
</html>
